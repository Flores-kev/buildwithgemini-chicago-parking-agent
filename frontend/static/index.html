<!DOCTYPE html>
<html lang="en" data-theme="tacobell">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicago Parking Patrol - Realistic Street View Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Rubik+Mono+One&family=Outfit:wght@400;600;800&family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --tb-purple: #2A085C;
    --tb-purple-light: #7B2CBF;
    --tb-pink: #FF007F;
    --tb-cyan: #00E5FF;
    --tb-yellow: #FFBE0B;
    --tb-bg: #1B0238;
    --card-bg: #2D0B5A;
    --text-light: #FFF9E6;
    --border-neon: #FF007F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--tb-bg);
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    height: 100vh;
    background-image: 
      linear-gradient(rgba(255, 0, 127, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
    background-size: 30px 30px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  header {
    background: linear-gradient(135deg, var(--tb-purple) 0%, #4A0E8F 100%);
    border-bottom: 4px solid var(--tb-pink);
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(255, 0, 127, 0.3);
    flex-wrap: wrap;
    gap: 0.8rem;
    transition: all 0.25s ease;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .logo-title {
    font-family: 'Rubik Mono One', cursive;
    font-size: 1.3rem;
    color: var(--tb-yellow);
    text-shadow: 3px 3px 0px var(--tb-pink), 5px 5px 0px #000;
    letter-spacing: 1px;
    margin: 0;
    transition: all 0.25s ease;
  }

  .logo-badge {
    font-family: 'Righteous', cursive;
    background: var(--tb-cyan);
    color: var(--tb-purple);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    box-shadow: 2px 2px 0px var(--tb-pink);
    transition: all 0.25s ease;
  }

  .theme-switcher-container {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(0, 0, 0, 0.3);
    padding: 0.3rem 0.8rem;
    border-radius: 24px;
    border: 2px solid var(--tb-cyan);
    box-shadow: 2px 2px 0px var(--tb-pink);
    transition: all 0.25s ease;
  }

  .theme-label {
    font-family: 'Righteous', cursive;
    font-size: 0.8rem;
    color: var(--tb-yellow);
    letter-spacing: 0.5px;
  }

  .theme-select {
    background: var(--tb-purple);
    color: var(--tb-cyan);
    border: 1px solid var(--tb-pink);
    border-radius: 12px;
    padding: 0.3rem 0.6rem;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  .msg { margin: 1rem 0; }
  .msg.user { text-align: right; }

  .bubble {
    display: inline-block;
    padding: 1rem 1.2rem;
    border-radius: 12px;
    background: var(--card-bg);
    border: 2px solid var(--tb-cyan);
    color: var(--text-light);
    text-align: left;
    max-width: 90%;
    white-space: pre-wrap;
    box-shadow: 4px 4px 0px var(--tb-pink);
    font-size: 1rem;
    line-height: 1.5;
    transition: all 0.25s ease;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, var(--tb-pink) 0%, #D8006C 100%);
    color: #FFF;
    border: 2px solid var(--tb-yellow);
    box-shadow: -4px 4px 0px var(--tb-cyan);
    font-weight: 600;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* --- Structured Risk Widget --- */
  .risk-widget {
    margin: 0.8rem 0;
    padding: 1rem;
    border-radius: 12px;
    background: #1E053D;
    border: 2px solid var(--tb-cyan);
    box-shadow: 4px 4px 0px var(--tb-pink);
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    transition: all 0.25s ease;
  }

  .risk-widget.risk-low { border-color: #00E676; box-shadow: 4px 4px 0px #00B0FF; }
  .risk-widget.risk-medium { border-color: #FFD600; box-shadow: 4px 4px 0px #FF6D00; }
  .risk-widget.risk-high { border-color: #FF1744; box-shadow: 4px 4px 0px #D50000; animation: pulse-border 1.5s infinite; }

  @keyframes pulse-border {
    0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(255, 23, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); }
  }

  .risk-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .risk-title-badge {
    font-family: 'Righteous', cursive;
    font-size: 1rem;
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .risk-low .risk-title-badge { background: #00E676; color: #003311; }
  .risk-medium .risk-title-badge { background: #FFD600; color: #332200; }
  .risk-high .risk-title-badge { background: #FF1744; color: #FFFFFF; }

  .timer-display {
    font-family: 'Rubik Mono One', cursive;
    font-size: 1.1rem;
    color: var(--tb-yellow);
    background: rgba(0,0,0,0.4);
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--tb-cyan);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .widget-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .action-btn {
    background: var(--tb-purple-light);
    color: #FFF;
    border: 1px solid var(--tb-cyan);
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.15s ease;
  }

  .action-btn:hover {
    background: var(--tb-pink);
    border-color: var(--tb-yellow);
  }

  /* --- Omni Car Parking Realistic Video Card --- */
  .omni-video-card {
    background: #0D011D;
    border: 3px solid var(--tb-cyan);
    border-radius: 12px;
    padding: 0.8rem;
    box-shadow: 4px 4px 0px var(--tb-pink);
    margin-top: 0.8rem;
  }

  .omni-video-title {
    font-family: 'Righteous', cursive;
    color: var(--tb-cyan);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .omni-canvas-wrapper {
    position: relative;
    width: 100%;
    height: 240px;
    background: #110022;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid var(--tb-yellow);
  }

  canvas.omni-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .video-controls-bar {
    margin-top: 0.5rem;
    display: flex;
    gap: 0.6rem;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .streetview-link-card {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--tb-cyan);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.5rem;
  }

  .generated-img-card {
    margin-top: 0.8rem;
    background: var(--card-bg);
    border: 3px solid var(--tb-yellow);
    border-radius: 12px;
    padding: 0.8rem;
    box-shadow: 5px 5px 0px var(--tb-pink);
    transition: all 0.25s ease;
  }

  .generated-img-card img {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 8px;
    border: 2px solid var(--tb-cyan);
  }

  .generated-img-caption {
    font-family: 'Righteous', cursive;
    color: var(--tb-yellow);
    margin-top: 0.5rem;
    font-size: 0.95rem;
    text-align: center;
  }

  .quick-chips {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding: 0.5rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }

  .chip-btn {
    background: var(--tb-purple-light);
    color: var(--tb-yellow);
    border: 2px solid var(--tb-cyan);
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    font-family: 'Righteous', cursive;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 2px 2px 0px var(--tb-pink);
    transition: all 0.15s ease;
  }

  .chip-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0px var(--tb-pink);
    background: var(--tb-pink);
    color: #FFF;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 1rem;
    border-top: 4px solid var(--tb-pink);
    background: var(--tb-purple);
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    transition: all 0.25s ease;
  }

  .input-label {
    font-family: 'Righteous', cursive;
    font-size: 0.9rem;
    color: var(--tb-cyan);
    letter-spacing: 0.5px;
  }

  .input-row {
    display: flex;
    gap: 0.6rem;
  }

  input {
    flex: 1;
    padding: 0.8rem 1rem;
    border: 2px solid var(--tb-cyan);
    border-radius: 8px;
    background: #15022C;
    color: #FFF;
    font-size: 1rem;
    font-family: 'Outfit', sans-serif;
    outline: none;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
    transition: all 0.25s ease;
  }

  input:focus {
    border-color: var(--tb-yellow);
    box-shadow: 0 0 10px var(--tb-yellow);
  }

  button {
    padding: 0.8rem 1.4rem;
    border: 2px solid var(--tb-yellow);
    border-radius: 8px;
    background: linear-gradient(135deg, var(--tb-pink) 0%, #C40062 100%);
    color: #FFF;
    font-family: 'Rubik Mono One', cursive;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 3px 3px 0px var(--tb-cyan);
    transition: all 0.15s ease;
  }

  button:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0px var(--tb-cyan);
    background: var(--tb-yellow);
    color: var(--tb-purple);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 3px solid var(--tb-cyan);
    border-radius: 12px;
    padding: 1.2rem;
    background: var(--card-bg);
    box-shadow: 5px 5px 0px var(--tb-pink);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.4; color: var(--text-light); }
  .a2text.a2-h1 { font-family: 'Rubik Mono One', cursive; font-size: 1.4rem; color: var(--tb-yellow); }
  .a2text.a2-h2 { font-family: 'Righteous', cursive; font-size: 1.2rem; color: var(--tb-cyan); }
  .a2text.a2-h3 { font-weight: 700; font-size: 1.1rem; color: var(--tb-pink); }
  .a2text.a2-h4 { font-weight: 600; font-size: 1rem; }
  .a2text.a2-caption { font-size: 0.85rem; color: #BBB; }
  .a2divider { border: none; border-top: 2px solid var(--tb-pink); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 8px; border: 2px solid var(--tb-yellow); display: block; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; vertical-align: middle; color: var(--tb-cyan); }

  /* ==========================================================================
     GOOGLE BRAND THEME OVERRIDES ([data-theme="google"])
     ========================================================================== */
  html[data-theme="google"] body {
    background: #F8F9FA;
    color: #202124;
    font-family: 'Google Sans', 'Roboto', system-ui, sans-serif;
    background-image: radial-gradient(#DADCE0 1px, transparent 1px);
    background-size: 24px 24px;
  }

  html[data-theme="google"] header {
    background: #FFFFFF;
    border-bottom: 1px solid #DADCE0;
    box-shadow: 0 1px 6px rgba(60,64,67,0.1);
  }

  html[data-theme="google"] .logo-title {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    color: #1A73E8;
    text-shadow: none;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.3px;
  }

  html[data-theme="google"] .logo-badge {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    background: #E6F4EA;
    color: #137333;
    border: 1px solid #CEEAD6;
    box-shadow: none;
    font-weight: 600;
  }

  html[data-theme="google"] .theme-switcher-container {
    background: #F1F3F4;
    border: 1px solid #DADCE0;
    box-shadow: none;
  }

  html[data-theme="google"] .theme-label {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    color: #5F6368;
    font-weight: 500;
  }

  html[data-theme="google"] .theme-select {
    background: #FFFFFF;
    color: #202124;
    border: 1px solid #DADCE0;
    font-family: 'Google Sans', 'Roboto', sans-serif;
  }

  html[data-theme="google"] .bubble {
    background: #FFFFFF;
    border: 1px solid #DADCE0;
    color: #202124;
    box-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 1px 2px rgba(60,64,67,0.24);
    border-radius: 16px;
    font-family: 'Google Sans', 'Roboto', sans-serif;
  }

  html[data-theme="google"] .msg.user .bubble {
    background: #1A73E8;
    color: #FFFFFF;
    border: none;
    box-shadow: 0 2px 6px rgba(26,115,232,0.3);
    border-radius: 18px 18px 4px 18px;
    font-weight: 500;
  }

  html[data-theme="google"] .risk-widget {
    background: #FFFFFF;
    border: 1px solid #DADCE0;
    box-shadow: 0 2px 8px rgba(60,64,67,0.12);
  }

  html[data-theme="google"] .timer-display {
    background: #F1F3F4;
    color: #202124;
    border: 1px solid #DADCE0;
    font-family: 'Google Sans', 'Roboto', sans-serif;
  }

  html[data-theme="google"] .action-btn {
    background: #1A73E8;
    color: #FFFFFF;
    border: none;
  }

  html[data-theme="google"] .omni-video-card {
    background: #FFFFFF;
    border: 1px solid #DADCE0;
    box-shadow: 0 2px 8px rgba(60,64,67,0.12);
  }

  html[data-theme="google"] .omni-video-title {
    font-family: 'Google Sans', sans-serif;
    color: #1A73E8;
  }

  html[data-theme="google"] .generated-img-card {
    background: #FFFFFF;
    border: 1px solid #DADCE0;
    box-shadow: 0 2px 8px rgba(60,64,67,0.12);
    border-radius: 12px;
  }

  html[data-theme="google"] .generated-img-card img {
    border: 1px solid #E8EAED;
  }

  html[data-theme="google"] .generated-img-caption {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    color: #1A73E8;
    font-weight: 500;
  }

  html[data-theme="google"] .chip-btn {
    background: #FFFFFF;
    color: #3C4043;
    border: 1px solid #DADCE0;
    font-family: 'Google Sans', 'Roboto', sans-serif;
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(60,64,67,0.1);
  }

  html[data-theme="google"] .chip-btn:hover {
    background: #E8F0FE;
    color: #1A73E8;
    border-color: #D2E3FC;
    transform: none;
    box-shadow: 0 2px 4px rgba(60,64,67,0.15);
  }

  html[data-theme="google"] form {
    background: #FFFFFF;
    border-top: 1px solid #DADCE0;
    box-shadow: 0 -2px 10px rgba(60,64,67,0.05);
  }

  html[data-theme="google"] .input-label {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    color: #5F6368;
    font-weight: 500;
  }

  html[data-theme="google"] input {
    background: #F1F3F4;
    color: #202124;
    border: 1px solid #DADCE0;
    border-radius: 24px;
    font-family: 'Google Sans', 'Roboto', sans-serif;
    box-shadow: none;
  }

  html[data-theme="google"] input:focus {
    background: #FFFFFF;
    border-color: #1A73E8;
    box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
  }

  html[data-theme="google"] button[type="submit"] {
    background: #1A73E8;
    color: #FFFFFF;
    border: none;
    border-radius: 24px;
    font-family: 'Google Sans', 'Roboto', sans-serif;
    font-weight: 500;
    box-shadow: 0 1px 3px rgba(60,64,67,0.3);
  }

  html[data-theme="google"] button[type="submit"]:hover {
    background: #1765CC;
    transform: none;
    box-shadow: 0 2px 6px rgba(60,64,67,0.3);
  }

  html[data-theme="google"] .a2card {
    border: 1px solid #DADCE0;
    background: #FFFFFF;
    box-shadow: 0 1px 3px rgba(60,64,67,0.12);
    border-radius: 12px;
  }
  html[data-theme="google"] .a2text { color: #202124; }
  html[data-theme="google"] .a2text.a2-h1 { font-family: 'Google Sans', sans-serif; color: #1A73E8; }
  html[data-theme="google"] .a2text.a2-h2 { font-family: 'Google Sans', sans-serif; color: #34A853; }
  html[data-theme="google"] .a2text.a2-h3 { font-family: 'Google Sans', sans-serif; color: #EA4335; }
  html[data-theme="google"] .a2divider { border-top: 1px solid #DADCE0; }
  html[data-theme="google"] .material-symbols-outlined { color: #1A73E8; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1 class="logo-title" id="logo-title">🔔 CHICAGO PARKING PATROL</h1>
    <span class="logo-badge" id="badge-text">1980s RETRO</span>
  </div>
  <div class="theme-switcher-container">
    <span class="theme-label">THEME:</span>
    <select id="theme-select" class="theme-select" onchange="setTheme(this.value)">
      <option value="tacobell">🌮 80s Taco Bell</option>
      <option value="google">🔵 Google Material</option>
    </select>
  </div>
</header>

<div id="log"></div>

<div class="quick-chips">
  <button class="chip-btn" onclick="sendQuick('Where did I park?')">🚗 My Saved Spot</button>
  <button class="chip-btn" onclick="sendQuick('I parked at 1200 N Milwaukee Ave')">📍 1200 N Milwaukee Ave</button>
  <button class="chip-btn" onclick="sendQuick('I parked at 2400 N Clark St')">📍 2400 N Clark St</button>
  <button class="chip-btn" onclick="sendQuick('I parked at 800 N Michigan Ave')">📍 800 N Michigan Ave</button>
</div>

<form id="form">
  <label class="input-label" id="input-label" for="input">WHERE DID YOU PARK YOUR RIDE?</label>
  <div class="input-row">
    <input id="input" placeholder="e.g. 1200 N Milwaukee Ave..." autocomplete="off" autofocus>
    <button type="submit" id="submit-btn">CHECK 🔔</button>
  </div>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("app-theme", theme);
  const badge = document.getElementById("badge-text");
  const inputLabel = document.getElementById("input-label");
  const submitBtn = document.getElementById("submit-btn");
  if (badge) badge.textContent = theme === "google" ? "GOOGLE BRAND" : "1980s RETRO";
  if (inputLabel) inputLabel.textContent = theme === "google" ? "Check Chicago Parking Restrictions" : "WHERE DID YOU PARK YOUR RIDE?";
  if (submitBtn) submitBtn.textContent = theme === "google" ? "Check Restrictions" : "CHECK 🔔";
}

// Restore saved theme preference or default to tacobell
const savedTheme = localStorage.getItem("app-theme") || "tacobell";
document.getElementById("theme-select").value = savedTheme;
setTheme(savedTheme);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function sendQuick(txt) {
  input.value = txt;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

// --- Live Countdown & Calendar Functions ---
function addToCalendar(title, details, isoTime) {
  const dateStr = (isoTime ? new Date(isoTime) : new Date(Date.now() + 3 * 3600 * 1000)).toISOString().replace(/-|:|\.\d+/g, "");
  const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&details=${encodeURIComponent(details)}&dates=${dateStr}/${dateStr}`;
  window.open(gcalUrl, '_blank');
}

function startCountdown(timerEl, targetTimeMs) {
  function update() {
    const now = Date.now();
    const diff = Math.max(0, targetTimeMs - now);
    if (diff === 0) {
      timerEl.textContent = "00h 00m 00s (EXPIRED)";
      return;
    }
    const h = Math.floor(diff / (1000 * 3600)).toString().padStart(2, "0");
    const m = Math.floor((diff % (1000 * 3600)) / (1000 * 60)).toString().padStart(2, "0");
    const s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, "0");
    timerEl.textContent = `${h}h ${m}m ${s}s`;
  }
  update();
  setInterval(update, 1000);
}

// --- Omni Realistic Street View Car Parking Video Canvas ---
function initOmniParkingCanvas(canvas, address, replayBtn) {
  const ctx = canvas.getContext('2d');
  let x = -80;
  let targetX = 180;
  let animFrame;
  let isLoaded = false;
  let heading = 90;

  // Real Street View Panorama Image Source based on specific building address
  const streetImg = new Image();
  streetImg.crossOrigin = "Anonymous";
  const cleanAddr = address ? address.replace(/I parked at\s*/i, '').trim() : "Chicago, IL";
  streetImg.src = `https://maps.googleapis.com/maps/api/streetview?size=600x300&location=${encodeURIComponent(cleanAddr + ', Chicago, IL')}&fov=90&heading=${heading}&pitch=0`;

  streetImg.onload = () => { isLoaded = true; };
  streetImg.onerror = () => {
    // High quality fallback realistic Chicago street building image
    streetImg.src = "https://images.unsplash.com/photo-1517816743773-6e0fd518b4a6?auto=format&fit=crop&w=800&q=80";
  };

  function startAnimation() {
    x = -80;
    cancelAnimationFrame(animFrame);
    render();
  }

  if (replayBtn) {
    replayBtn.onclick = startAnimation;
  }

  function render() {
    canvas.width = canvas.parentElement.clientWidth || 320;
    canvas.height = 240;
    const w = canvas.width;
    const h = canvas.height;

    // Draw Realistic Street View Building Background
    if (streetImg.complete && streetImg.naturalWidth > 0) {
      ctx.drawImage(streetImg, 0, 0, w, h * 0.70);
    } else {
      ctx.fillStyle = "#1B182B";
      ctx.fillRect(0, 0, w, h * 0.70);
      ctx.fillStyle = "#00E5FF";
      ctx.font = "14px Outfit, sans-serif";
      ctx.fillText(`🏢 Building Frontage: ${cleanAddr}`, 15, 60);
    }

    // Draw Asphalt Roadway & Parking Curb Line
    ctx.fillStyle = "#1E2026";
    ctx.fillRect(0, h * 0.70, w, h * 0.30);

    // Sidewalk & Curb Line
    ctx.fillStyle = "#70757A";
    ctx.fillRect(0, h * 0.68, w, 6);
    ctx.fillStyle = "#FFD600"; // Yellow Paint Curb
    ctx.fillRect(0, h * 0.70 - 2, w, 2);

    // Parking Spot Target Box in front of Building
    ctx.strokeStyle = "#00E676";
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 4]);
    ctx.strokeRect(targetX - 10, h * 0.72, 110, 50);
    ctx.setLineDash([]);

    // Parking Slot Label HUD
    ctx.fillStyle = "rgba(0, 230, 118, 0.2)";
    ctx.fillRect(targetX - 10, h * 0.72, 110, 50);
    ctx.fillStyle = "#00E676";
    ctx.font = "bold 11px Outfit, sans-serif";
    ctx.fillText("SAFE CURB ZONE", targetX, h * 0.72 - 6);

    // Drive & Park Car Animation
    if (x < targetX) {
      x += 2.2;
    }

    // Realistic Sports Sedan Car Rendering
    const carY = h * 0.73;

    // Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
    ctx.beginPath();
    ctx.ellipse(x + 40, carY + 38, 45, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Car Body Metallic Red/Magenta
    ctx.fillStyle = "#E50914";
    ctx.beginPath();
    ctx.roundRect(x, carY, 80, 32, 6);
    ctx.fill();

    // Car Roof / Windows
    ctx.fillStyle = "#111A2E";
    ctx.beginPath();
    ctx.roundRect(x + 18, carY - 12, 44, 18, 4);
    ctx.fill();

    // Wheels
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(x + 18, carY + 32, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 62, carY + 32, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#E8EAED";
    ctx.beginPath(); ctx.arc(x + 18, carY + 32, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 62, carY + 32, 4, 0, Math.PI * 2); ctx.fill();

    // Headlights Beam
    ctx.fillStyle = "rgba(255, 235, 59, 0.4)";
    ctx.beginPath();
    ctx.moveTo(x + 80, carY + 12);
    ctx.lineTo(x + 140, carY + 2);
    ctx.lineTo(x + 140, carY + 30);
    ctx.closePath();
    ctx.fill();

    // Turn Indicator Signal when Parking
    if (x < targetX && Math.floor(Date.now() / 200) % 2 === 0) {
      ctx.fillStyle = "#FF9800";
      ctx.beginPath(); ctx.arc(x + 78, carY + 8, 4, 0, Math.PI * 2); ctx.fill();
    }

    // Brake Lights when Parked
    if (x >= targetX) {
      ctx.fillStyle = "#FF1744";
      ctx.fillRect(x, carY + 8, 4, 12);
      ctx.fillStyle = "#00E676";
      ctx.font = "bold 13px Outfit, sans-serif";
      ctx.fillText(`✅ PARKED IN FRONT OF ${cleanAddr.toUpperCase()}`, 20, 30);
    } else {
      animFrame = requestAnimationFrame(render);
    }
  }

  render();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  let textStr = texts.join("\n").trim();

  // Extract risk level
  let riskLevel = "LOW";
  let riskClass = "risk-low";
  let riskIcon = "🟢";
  let riskTitle = "SAFE TO PARK / LOW RISK";

  if (/DANGER|HIGH RISK|TOW|IMPOUND|BAN/i.test(textStr)) {
    riskLevel = "HIGH";
    riskClass = "risk-high";
    riskIcon = "🚨";
    riskTitle = "HIGH RISK / TOW DANGER - MOVE IMMEDIATELY";
  } else if (/WARNING|MEDIUM RISK|SWEEPING|RESTRICTED|METER/i.test(textStr)) {
    riskLevel = "MEDIUM";
    riskClass = "risk-medium";
    riskIcon = "⚠️";
    riskTitle = "MEDIUM RISK / TIME-RESTRICTED PARKING";
  }

  // Extract address if available
  const addrMatch = textStr.match(/\b(?:\d{1,5}\s+[NnSsEeWw]?\s*[A-Za-z0-9\s]+(?:Ave|St|Blvd|Rd|Dr|Way|Pl|Ct))\b/i);
  const currentAddress = addrMatch ? addrMatch[0] : "1200 N Milwaukee Ave";

  // Create Structured Risk Widget (Recommendation #2)
  const widget = el("div", `risk-widget ${riskClass}`);
  const headerDiv = el("div", "risk-header");
  const badgeSpan = el("div", "risk-title-badge", `${riskIcon} ${riskTitle}`);
  
  const timerDisplay = el("div", "timer-display");
  timerDisplay.innerHTML = `<span class="material-symbols-outlined">schedule</span> <span id="timer-${Date.now()}">03h 00m 00s</span>`;
  
  headerDiv.appendChild(badgeSpan);
  headerDiv.appendChild(timerDisplay);
  widget.appendChild(headerDiv);

  const targetTimeMs = Date.now() + 3 * 3600 * 1000;
  setTimeout(() => {
    const timerEl = timerDisplay.querySelector("span[id^='timer-']");
    if (timerEl) startCountdown(timerEl, targetTimeMs);
  }, 100);

  const actionsDiv = el("div", "widget-actions");
  const calBtn = el("button", "action-btn", "📅 Add Move-By Reminder");
  calBtn.onclick = () => addToCalendar(`Chicago Parking Move-By: ${currentAddress}`, `Avoid ticket / towing at ${currentAddress}`, new Date(targetTimeMs).toISOString());
  
  actionsDiv.appendChild(calBtn);
  widget.appendChild(actionsDiv);
  b.appendChild(widget);

  if (textStr) {
    const txtNode = el("div", null, textStr);
    b.appendChild(txtNode);
  }

  // Recommendation #4: Realistic Omni Car Parking Video Card in front of actual building address
  const omniCard = el("div", "omni-video-card");
  const omniTitle = el("div", "omni-video-title");
  omniTitle.innerHTML = `<span>🎬 OMNI REALISTIC PARKING VIDEO</span> <span>🏢 ${currentAddress}</span>`;
  
  const canvasWrapper = el("div", "omni-canvas-wrapper");
  const canvas = el("canvas", "omni-canvas");
  canvasWrapper.appendChild(canvas);
  omniCard.appendChild(omniTitle);
  omniCard.appendChild(canvasWrapper);

  const videoControlsBar = el("div", "video-controls-bar");
  const replayBtn = el("button", "action-btn", "🔄 Replay Parking Video");
  const svLinkBtn = el("a", "action-btn", "🔍 Open Google Street View ↗");
  svLinkBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentAddress + ', Chicago, IL')}`;
  svLinkBtn.target = "_blank";
  svLinkBtn.style.textDecoration = "none";

  videoControlsBar.appendChild(replayBtn);
  videoControlsBar.appendChild(svLinkBtn);
  omniCard.appendChild(videoControlsBar);
  b.appendChild(omniCard);

  setTimeout(() => initOmniParkingCanvas(canvas, currentAddress, replayBtn), 150);

  // Extract public image URLs (https://storage.googleapis.com/.../*.jpg|png) from text if present
  const imageUrlMatch = textStr.match(/https:\/\/storage\.googleapis\.com\/[^\s"'\)\]>]+\.(?:jpg|jpeg|png)/i);
  if (imageUrlMatch) {
    const imgCard = el("div", "generated-img-card");
    const img = el("img", null);
    img.src = imageUrlMatch[0];
    img.alt = "Generated Street Cross-Section";
    const isGoogle = document.documentElement.getAttribute("data-theme") === "google";
    const captionText = isGoogle ? "📊 Street Cross-Section Restriction Diagram" : "⚡ 1980s RETRO STREET CROSS-SECTION DIAGRAM";
    const caption = el("div", "generated-img-caption", captionText);
    imgCard.appendChild(img);
    imgCard.appendChild(caption);
    b.appendChild(imgCard);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const isGoogle = document.documentElement.getAttribute("data-theme") === "google";
  const loadingText = isGoogle ? "Checking Chicago parking restrictions..." : "⚡ CALLING 80s PARKING PATROL & GENERATING STREET DIAGRAM...";
  const b = bubble("agent"); b.textContent = loadingText;
  try {
    const activeTheme = document.documentElement.getAttribute("data-theme") || "tacobell";
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, theme: activeTheme })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
